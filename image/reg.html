
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Registration - Online Medicine Shop</title>
</head>
<body>
<h2>Online Medicine Shop - Seller Registration</h2>
<form action="#" method="post" enctype="multipart/form-data">
<!-- Account Information -->
<fieldset>
<legend>Account Information</legend>
<table>
<tr>
 <td><label for="userid">User ID:</label></td>
 <td><input type="text" id="userid" name="userid" required></td>
 <td><label for="password">Password:</label></td>
 <td><input type="password" id="password" name="password" required></td>
</tr>
<tr>
 <td><label for="confirm_password">Confirm Password:</label></td>
 <td><input type="password" id="confirm_password" name="confirm_password" required></td>
 <td><label for="security">Security Level:</label></td>
 <td>
 <select id="security" name="security">
 <option value="low">Low</option>
 <option value="medium">Medium</option>
 <option value="high">High</option>
 </select>
 </td>
</tr>
</table>
</fieldset>
<br>
<!-- Shop Information -->
<fieldset>
<legend>Shop Information</legend>
<table>
<tr>
 <td><label for="owner_name">Owner Name:</label></td>
 <td><input type="text" id="owner_name" name="owner_name" required></td>
 <td><label for="shop_name">Shop Name:</label></td>
 <td><input type="text" id="shop_name" name="shop_name" required></td>
</tr>
<tr>
 <td><label for="shop_type">Shop Type:</label></td>
 <td>
 <select id="shop_type" name="shop_type">
 <option value="pharmacy">Pharmacy</option>
 <option value="wholesaler">Wholesaler</option>
 <option value="distributor">Distributor</option>
 <option value="manufacturer">Manufacturer</option>
 </select>
 </td>
 <td><label for="email">Email:</label></td>
 <td><input type="email" id="email" name="email" required></td>
</tr>
<tr>
 <td><label for="drug_license">Drug License No:</label></td>
 <td><input type="text" id="drug_license" name="drug_license" required></td>
 <td><label for="trade_license">Trade License No:</label></td>
 <td><input type="text" id="trade_license" name="trade_license" required></td>
</tr>
<tr>
 <td><label for="phone">Phone:</label></td>
 <td><input type="tel" id="phone" name="phone" required></td>
 <td><label for="est_year">Established Year:</label></td>
 <td><input type="number" id="est_year" name="est_year" min="1950" max="2026"></td>
</tr>
<tr>
  <td><label for="address">Shop Address:</label></td>
 <td><textarea id="address" name="address" rows="3" cols="40"></textarea></td>
</tr>
</table>
</fieldset>
<br>
<!-- Business Experience -->
<fieldset>
<legend>Business Experience</legend>
<table>
<tr>
 <td>Seller Type:</td>
 <td colspan="3">
 <input type="radio" id="individual" name="seller_type" value="individual">
 <label for="individual">Individual</label>
 <input type="radio" id="company" name="seller_type" value="company">
 <label for="company">Company</label>
 <input type="radio" id="chain" name="seller_type" value="chain">
 <label for="chain">Chain Store</label>
 </td>
</tr>
<tr>
 <td><label for="prev_company">Previous Business Name:</label></td>
 <td><input type="text" id="prev_company" name="prev_company"></td>
 <td><label for="position">Position:</label></td>
 <td><input type="text" id="position" name="position"></td>
</tr>
<tr>
 <td><label for="experience">Experience:</label></td>
 <td>
 <select id="experience" name="experience">
 <option value="0">0 Year</option>
 <option value="1">1 Year</option>
 <option value="2">2 Years</option>
 <option value="3">3 Years</option>
 <option value="5">5 Years</option>
 <option value="10">10+ Years</option>
 </select>
 </td>
 <td><label for="monthly_sales">Avg. Monthly Sales:</label></td>
 <td><input type="number" id="monthly_sales" name="monthly_sales" min="0"></td>
</tr>
</table>
</fieldset>
<br>
<!-- Products & Delivery -->
<fieldset>
<legend>Products &amp; Delivery</legend>
<table>
<tr>
 <td>Product Categories:</td>
 <td>
 <input type="checkbox" id="cat_tablet" name="category" value="tablet">
 <label for="cat_tablet">Tablets</label>
 <input type="checkbox" id="cat_syrup" name="category" value="syrup">
 <label for="cat_syrup">Syrups</label>
 <input type="checkbox" id="cat_injection" name="category" value="injection">
 <label for="cat_injection">Injections</label>
 <input type="checkbox" id="cat_baby" name="category" value="baby_care">
 <label for="cat_baby">Baby Care</label>
 <input type="checkbox" id="cat_device" name="category" value="devices">
 <label for="cat_device">Medical Devices</label>
 </td>
</tr>
<tr>
 <td><label for="delivery_area">Delivery Area:</label></td>
 <td>
 <select id="delivery_area" name="delivery_area" multiple size="4">
 <option value="dhaka">Dhaka</option>
 <option value="chattogram">Chattogram</option>
 <option value="sylhet">Sylhet</option>
 <option value="rajshahi">Rajshahi</option>
 <option value="khulna">Khulna</option>
 </select>
 </td>
 </tr>
<tr>
 <td><label for="stock_level">Stock Capacity:</label></td>
 <td><input type="range" id="stock_level" name="stock_level" min="0" max="100" value="50"></td>
</tr>
</table>
</fieldset>
<br>
<!-- Documents & Payout -->
<fieldset>
<legend>Documents &amp; Payout</legend>
<table>
<tr>
 <td><label for="shop_logo">Shop Logo:</label></td>
 <td><input type="file" id="shop_logo" name="shop_logo" accept="image/*"></td>
 <td><label for="license_upload">Drug License Upload:</label></td>
 <td><input type="file" id="license_upload" name="license_upload"></td>
</tr>
<tr>
 <td><label for="payout_method">Payout Method:</label></td>
 <td>
 <select id="payout_method" name="payout_method">
 <option value="bank">Bank Transfer</option>
 <option value="bkash">bKash</option>
 <option value="nagad">Nagad</option>
 <option value="rocket">Rocket</option>
 </select>
 </td>
 <td><label for="account_number">Account Number:</label></td>
 <td><input type="text" id="account_number" name="account_number"></td>
</tr>
</table>
</fieldset>
<br>
<!-- Emergency Contact & Agreement -->
<fieldset>
<legend>Emergency Contact &amp; Agreement</legend>
<table>
<tr>
 <td><label for="emergency_person">Emergency Person:</label></td>
 <td><input type="text" id="emergency_person" name="emergency_person"></td>
 <td><label for="emergency_phone">Phone:</label></td>
 <td><input type="tel" id="emergency_phone" name="emergency_phone"></td>
</tr>
</table>
<input type="checkbox" id="confirm_info" name="confirm_info" required>
<label for="confirm_info">I confirm all information is correct.</label><br>
<input type="checkbox" id="accept_terms" name="accept_terms" required>
<label for="accept_terms">I accept terms and conditions.</label><br>
<input type="checkbox" id="updates" name="updates">
<label for="updates">Receive future updates.</label>
</fieldset>
<br>
<input type="submit" value="Register">
<input type="reset" value="Reset">
</form>
</body>
</html>
